[project]
name = "davidkhala.ai"
version = "0.2.3"
description = "AI Studio"
readme = "README.md"
requires-python = ">=3.12"
[project.optional-dependencies]
google = ["google-genai", "google-adk"]

mistral = ["mistralai", "davidkhala-ml-ocr", 'davidkhala-ai-models']
you = ['youdotcom']
ali = ["dashscope", "wuying-agentbay-sdk", 'davidkhala-ai-models']

telemetry = [
    "opik ; python_version < '3.14'" # limit py version: PyO3 v0.22.6 currently supports up to Python 3.13.
]
[tool.hatch.build.targets.sdist]
include = ["davidkhala"]

[tool.hatch.build.targets.wheel]
include = ["davidkhala"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest", 'davidkhala-ai-models'
]
ali = ["playwright"]
telemetry = ["google-genai", "google-adk"]